[project]
name = "meditation-bot"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "aiogram==3.18.0",
    "aiosqlite==0.20.0",
    "python-dotenv==1.0.1",
]

[tool.pytest.ini_options]
pythonpath = [".", "src"]
asyncio_mode = "auto"

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.isort]
profile = "black"
line_length = 100
